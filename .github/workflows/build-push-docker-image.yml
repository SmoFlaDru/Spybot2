name: Create, publish and deploy Docker image

on:
  push:
    branches: ['master']
# Two pushes to master close together (e.g. two PRs merged back-to-back) each start their own
# build+deploy run. Without this, both runs deploy independently and whichever's slower build
# happens to finish last wins - even if it's the older commit. Cancelling the older run when a
# newer push arrives guarantees the newest commit is always what ends up deployed.
concurrency:
  group: production-deploy
  cancel-in-progress: true
# Defines a custom environment variable for the workflow, used for the Container registry domain.
env:
  REGISTRY: ghcr.io
jobs:
  build-push:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            dockerfile: Dockerfile
          - image: recorder
            dockerfile: spybot-recorder/Dockerfile
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image names must be lowercase, but the repository owner/name (SmoFlaDru/Spybot2) isn't.
      - name: Compute image name
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=$REGISTRY/${GITHUB_REPOSITORY,,}-$IMAGE" >> "$GITHUB_OUTPUT"
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # branch event
            type=ref,event=branch
            # tag event
            type=ref,event=tag
            # commit sha (long)
            type=sha,format=long
            # floating tag pointed at the most recent build of this branch
            type=raw,value=latest
      # This step uses the `docker/build-push-action` action to build the image from the given Dockerfile. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: "linux/arm64"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy to Server
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: upload infrastructure files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_SECONDARY_HOST }}
          username: ${{ secrets.SSH_SECONDARY_USERNAME }}
          password: ${{ secrets.SSH_SECONDARY_PASSWORD }}
          port: ${{ secrets.SSH_SECONDARY_PORT }}
          source: infrastructure/*
          target: spybot
          strip_components: 1
      - name: execute remote ssh commands
        uses: appleboy/ssh-action@master
        env:
          SECRET: ${{ secrets.ENV_FILE }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_SECONDARY_HOST }}
          username: ${{ secrets.SSH_SECONDARY_USERNAME }}
          password: ${{ secrets.SSH_SECONDARY_PASSWORD }}
          port: ${{ secrets.SSH_SECONDARY_PORT }}
          envs: SECRET,COMMIT_SHA
          # Pin the deploy to the exact images just built (sha-<commit>), rather than :latest, so a
          # concurrent push starting a new build elsewhere can't race this deploy onto a half-built
          # or unintended version.
          script: |
            cd spybot
            echo "$SECRET" > .env
            echo "SPYBOT_IMAGE_TAG=sha-${COMMIT_SHA}" >> .env
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
