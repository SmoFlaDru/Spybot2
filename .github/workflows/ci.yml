name: 'CI'

on:
  # push only covers master: every PR here targets master and dev is the
  # long-lived head of an open PR into it, so a push to dev already fires
  # pull_request:synchronize - adding dev to push too runs this twice per commit.
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

# The two jobs are independent: the Kotlin tests don't need the frontend bundle (only bootJar
# does, and that is built by the Docker image workflow), so they run in parallel and fail
# separately. If a future job needs the real bundle, give it `needs: frontend` and pass
# frontend/output along as an artifact rather than chaining the two jobs here.
jobs:
  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          # Same major as the Dockerfile's frontend-build stage, so CI can't pass on a Node the
          # image build then rejects.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build bundle
        run: npm run package

  kotlin:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is generated from git history at build time
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin unit tests
        run: ./gradlew :spybot-core:test :spybot-web:test :spybot-recorder:test --console=plain
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: '**/build/test-results/test/**/*.xml'
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()
        with:
          files: '**/build/test-results/test/**/*.xml'
          check_name: 'Kotlin Test Results'
