name: 'Kotlin CI'

on:
  # push only covers master: every PR here targets master and dev is the
  # long-lived head of an open PR into it, so a push to dev already fires
  # pull_request:synchronize - adding dev to push too runs this twice per commit.
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin unit tests
        run: ./gradlew :spybot-core:test :spybot-web:test :spybot-recorder:test --console=plain
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: '**/build/test-results/test/**/*.xml'
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()
        with:
          files: '**/build/test-results/test/**/*.xml'
          check_name: 'Kotlin Test Results'
