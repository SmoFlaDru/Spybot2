name: Deploy via Dokploy manually

on:
#  push:
#    branches: ["master"]
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy to Dokploy manually
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No specific build to pin to here (unlike the automated workflow, which pins to the
      # commit it just built) - re-pulls whatever :latest currently points at.
      - name: Update compose file + environment, then deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg env "$ENV_FILE" \
                --rawfile compose infrastructure/docker-compose.dokploy.yml \
                '{composeId: $id, env: $env, composeFile: $compose}' \
            | curl -fsS -X POST "$DOKPLOY_URL/api/compose.update" \
                -H "x-api-key: $DOKPLOY_API_KEY" -H "content-type: application/json" --data @-
          jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg title "Manual deploy" \
                '{composeId: $id, title: $title}' \
            | curl -fsS -X POST "$DOKPLOY_URL/api/compose.deploy" \
                -H "x-api-key: $DOKPLOY_API_KEY" -H "content-type: application/json" --data @-
