# Local development stack: builds spybot-web and spybot-recorder from this checkout.
# Production is deployed by Dokploy from infrastructure/docker-compose.dokploy.yml.
#
# Select this file with `COMPOSE_FILE=docker-compose.local.yml` in your (git-ignored) .env, then use
# plain `docker compose build` / `docker compose up -d`. Needs secrets/db_password.txt.
services:
  spybot-web:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=.buildx-cache/spybot-web
      cache_to:
        - type=local,dest=.buildx-cache/spybot-web,mode=max
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      SPRING_PROFILES_ACTIVE: ""
      #SPRING_PROFILES_ACTIVE: localdev
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    secrets:
      - db_password
    volumes:
      - $PWD:/workspace
    # Flyway runs as part of spybot-web's own startup (before it starts accepting requests), so a
    # passing healthcheck means migrations have already completed successfully. spybot-recorder
    # depends on this (condition: service_healthy below) so it never queries a column a pending
    # migration hasn't added yet. No curl/wget in this JRE base image, so this uses bash's /dev/tcp
    # instead of a separate HTTP client.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  spybot-recorder:
    build:
      context: .
      dockerfile: spybot-recorder/Dockerfile
      cache_from:
        - type=local,src=.buildx-cache/spybot-recorder
      cache_to:
        - type=local,dest=.buildx-cache/spybot-recorder,mode=max
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    depends_on:
      db:
        condition: service_started
      spybot-web:
        condition: service_healthy
    secrets:
      - db_password
  db:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - spybot_pg_data:/var/lib/postgresql/data
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  spybot_pg_data:
secrets:
  db_password:
    file: secrets/db_password.txt
