# Production stack as deployed by Dokploy (a "Compose" service of type docker-compose, raw source).
# The workflow pushes this file to Dokploy on every deploy, so this repo is the source of truth.
#
# Differences from docker-compose.yml (used for local development, together with the override file):
#   - No caddy service: Dokploy's Traefik terminates TLS and routes spybot.bensge.com to
#     spybot-web:8000 (the domain is configured in the Dokploy UI, not here).
#   - No published ports: spybot-web is only reachable through Traefik, the database not at all
#     from outside the stack.
#   - .env is generated by Dokploy from the service's environment variables.
#   - The database password file is a Dokploy "File Mount" (stored in ../files/db_password.txt).
# Docker keeps container logs forever by default; cap them so they can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  spybot-web:
    image: ghcr.io/smofladru/spybot2-web:${SPYBOT_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    expose:
      - "8000"
    depends_on:
      - db
    secrets:
      - db_password
    networks:
      - default
      # Shared network with Dokploy's Traefik, which routes spybot.bensge.com to this service.
      - dokploy-network
    # Flyway runs as part of spybot-web's own startup (before it starts accepting requests), so a
    # passing healthcheck means migrations have already completed successfully. spybot-recorder
    # depends on this (condition: service_healthy below) so it never queries a column a pending
    # migration hasn't added yet. No curl/wget in this JRE base image, so this uses bash's /dev/tcp
    # instead of a separate HTTP client.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  spybot-recorder:
    image: ghcr.io/smofladru/spybot2-recorder:${SPYBOT_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    depends_on:
      db:
        condition: service_started
      spybot-web:
        condition: service_healthy
    secrets:
      - db_password
  db:
    image: postgres:17.2
    restart: always
    logging: *default-logging
    environment:
      # The postgres image only creates this database on first start of an empty volume.
      POSTGRES_DB: spybot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - spybot_pg_data:/var/lib/postgresql/data
    secrets:
      - db_password
networks:
  dokploy-network:
    external: true
volumes:
  spybot_pg_data:
secrets:
  db_password:
    file: ../files/db_password.txt
