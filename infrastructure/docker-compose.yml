services:
  spybot-web:
    image: ghcr.io/smofladru/spybot2-web:${SPYBOT_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "8000:8000"
    depends_on:
      - db
    secrets:
      - db_password
    # Flyway runs as part of spybot-web's own startup (before it starts accepting requests), so a
    # passing healthcheck means migrations have already completed successfully. spybot-recorder
    # depends on this (condition: service_healthy below) so it never queries a column a pending
    # migration hasn't added yet. No curl/wget in this JRE base image, so this uses bash's /dev/tcp
    # instead of a separate HTTP client.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  spybot-recorder:
    image: ghcr.io/smofladru/spybot2-recorder:${SPYBOT_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    depends_on:
      db:
        condition: service_started
      spybot-web:
        condition: service_healthy
    secrets:
      - db_password
  caddy:
    image: 'caddy:2.8-alpine'
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "20001:20001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
  db:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - spybot_pg_data:/var/lib/postgresql/data
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  caddy_data:
  caddy_config:
  spybot_pg_data:
secrets:
  db_password:
    file: secrets/db_password.txt
