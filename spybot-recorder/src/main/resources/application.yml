spring:
  application:
    name: spybot-recorder
  main:
    web-application-type: none
  jooq:
    sql-dialect: Postgres

management:
  endpoints:
    web:
      exposure:
        include: health,info

spybot:
  public-base-url: ${PUBLIC_BASE_URL:https://${SERVER_IP:localhost}}
  fido-server-name: ${FIDO_SERVER_NAME:Spybot local}
  steam-api-key: ${STEAM_API_KEY:}
  teamspeak:
    host: ${TS_IP:localhost}
    port: ${TS_PORT:10011}
    server-ip: ${SERVER_IP:localhost}
    user: ${TS_USER:}
    password: ${TS_PASSWORD:}
    nickname: ${TS_NICKNAME:Spybot_2}
