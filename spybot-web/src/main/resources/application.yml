spring:
  application:
    name: spybot-web
#  datasource:
#    url: ${DB_URL:}
#    username: ${DB_USER:}
#    password: ${DB_PASSWORD:}
  jooq:
    sql-dialect: Postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The database predates Flyway - it was built up by the old Django app's own migrations, not
    # by V1__baseline.sql. On a schema that already has tables but no flyway_schema_history yet,
    # this marks V1 as already applied (without running it) instead of trying to re-create tables
    # that already exist, then applies anything after it normally. Has no effect on a genuinely
    # empty database, which still gets V1 (and everything after) applied for real.
    baseline-on-migrate: true
    baseline-version: 1
  mvc:
    static-path-pattern: /**
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1d
          cache-public: true

gg:
  jte:
    usePrecompiledTemplates: true

sentry:
  dsn: ${SENTRY_DSN:}
  enabled: ${SENTRY_ENABLED:false}
  traces-sample-rate: 1.0
  logs:
    enabled: true
  logging:
    minimum-level: info
    minimum-breadcrumb-level: info
    minimum-event-level: error

logging:
  level:
    org:
      springframework:
        security: TRACE

server:
  port: ${PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spybot:
  public-base-url: ${PUBLIC_BASE_URL:https://${SERVER_IP:localhost}}
  fido-server-name: ${FIDO_SERVER_NAME:Spybot local}
  steam-api-key: ${STEAM_API_KEY:}
  teamspeak:
    host: ${TS_IP:localhost}
    port: ${TS_PORT:10011}
    server-ip: ${SERVER_IP:localhost}
    user: ${TS_USER:}
    password: ${TS_PASSWORD:}
    nickname: ${TS_NICKNAME:Spybot_2}
